<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raporty - Service Desk App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <style>
        /* --- Style Kontrolek Raportowania --- */
        .report-controls {
            background-color: var(--white);
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: flex-end; /* Wyrównanie przycisków do dołu inputów */
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-group label {
            font-weight: 500;
            font-size: 14px;
        }

        /* --- Style Tabeli Wyników --- */
        .report-table th { text-align: left; padding: 12px; background: var(--light-gray-bg); }
        .report-table td { padding: 12px; border-bottom: 1px solid var(--gray-border); }
        
        /* Wizualizacja paskowa (Bar Chart) wewnątrz tabeli */
        .bar-container { width: 100px; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px;}
        .bar-fill { height: 100%; background: var(--primary-blue); }
        
        /* Wskaźniki SLA */
        .sla-bad { color: var(--danger-red); font-weight: bold; }
        .sla-good { color: var(--status-otwarte); font-weight: bold; }
        
        .export-buttons {
            margin-left: auto; /* Przesunięcie przycisków eksportu maksymalnie w prawo */
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <header class="app-header">
            <div class="header-title">Centrum Raportowania</div>
            <div class="header-user-info">
                <span id="userName">Ładowanie...</span>
                <a href="dashboard.html" class="btn-logout" style="margin-right: 8px;">Powrót</a>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item">Zgłoszenia</a>
                    <a href="new-ticket.html" class="nav-item">Nowe zgłoszenie</a>
                    <a href="admin.html" class="nav-item">Panel Administracyjny</a>
                    <a href="reports.html" class="nav-item active">Raporty</a>
                </nav>
            </aside>
            
            <main class="main-content">
                <h1>Generator Raportów</h1>

                <div class="report-controls">
                    <div class="control-group">
                        <label>Okres raportu</label>
                        <select id="period-select" class="form-control" style="width: 200px;" onchange="updateDatesFromPeriod()">
                            <option value="today">Dzisiaj</option>
                            <option value="week">Ten Tydzień</option>
                            <option value="month" selected>Ten Miesiąc</option>
                            <option value="year">Ten Rok</option>
                            <option value="custom">Niestandardowy</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>Data od</label>
                        <input type="date" id="date-start" class="form-control">
                    </div>
                    <div class="control-group">
                        <label>Data do</label>
                        <input type="date" id="date-end" class="form-control">
                    </div>

                    <div class="control-group">
                        <label>Grupuj według</label>
                        <select id="type-select" class="form-control" style="width: 200px;">
                            <option value="specialist">Specjalista IT (Zamykający)</option>
                            <option value="group">Grupa IT</option>
                            <option value="category">Kategoria</option>
                            <option value="user">Zgłaszający Użytkownik</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label>&nbsp;</label>
                        <button class="btn-primary" onclick="generateReport()">Generuj</button>
                    </div>

                    <div class="export-buttons">
                        <button class="btn-primary" style="background-color: #6c757d;" onclick="downloadPDF()">Pobierz PDF</button>
                        <button class="btn-primary" style="background-color: #28a745;" onclick="downloadHTML()">Pobierz HTML</button>
                    </div>
                </div>

                <div class="table-container" id="report-results">
                    
                    <div style="padding: 24px; border-bottom: 2px solid var(--gray-border); display:none; margin-bottom: 16px;" id="report-header-print">
                    </div>

                    <table class="ticket-table report-table">
                        <thead>
                            <tr>
                                <th>Nazwa (Grupa/Osoba)</th>
                                <th>Liczba zgłoszeń</th>
                                <th>Śr. Czas Realizacji (godz.)</th>
                                <th>Przeterminowane (SLA)</th>
                            </tr>
                        </thead>
                        <tbody id="report-tbody">
                            <tr><td colspan="4" style="text-align:center; padding: 20px;">Wybierz parametry i kliknij Generuj.</td></tr>
                        </tbody>
                    </table>
                    
                    <div style="padding: 16px; font-size: 12px; color: #666; display:none; margin-top: 16px; border-top: 1px solid var(--gray-border);" id="report-footer-print">
                        Wygenerowano: <span id="report-generated-date"></span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        /**
         * Inicjalizacja strony (IIFE).
         * Sprawdza status uwierzytelnienia i rolę użytkownika.
         * Dostęp do raportów jest ściśle ograniczony dla roli 'sd'.
         */
        (async function() {
            const resp = await fetch('/.auth/me');
            const data = await resp.json();
            const user = data.clientPrincipal;
            
            // Przekierowanie, jeśli brak uprawnień
            if (!user || !user.userRoles.includes('sd')) {
                window.location.href = 'index.html';
                return;
            }
            document.getElementById('userName').textContent = user.userDetails;
            
            // Inicjalne ustawienie dat na bieżący miesiąc
            updateDatesFromPeriod(); 
        })();

        /**
         * Automatycznie przelicza i ustawia daty w inputach na podstawie wybranego okresu (select).
         * Ułatwia szybkie generowanie raportów bez konieczności ręcznego wybierania dni w kalendarzu.
         * Obsługuje logikę: Dziś, Tydzień, Miesiąc, Rok.
         */
        function updateDatesFromPeriod() {
            const period = document.getElementById('period-select').value;
            const startInput = document.getElementById('date-start');
            const endInput = document.getElementById('date-end');
            
            if (period === 'custom') return;

            const now = new Date();
            let start = new Date();
            let end = new Date();

            end.setHours(23, 59, 59, 999);

            if (period === 'today') {
                start.setHours(0, 0, 0, 0);
            } else if (period === 'week') {
                // Ustawienie na poniedziałek bieżącego tygodnia
                const day = now.getDay() || 7; 
                if (day !== 1) start.setHours(-24 * (day - 1));
                else start.setHours(0,0,0,0);
            } else if (period === 'month') {
                start.setDate(1);
                start.setHours(0,0,0,0);
            } else if (period === 'year') {
                start.setMonth(0, 1);
                start.setHours(0,0,0,0);
            }

            startInput.valueAsDate = start;
            endInput.valueAsDate = end;
        }

        /**
         * Pobiera zagregowane dane z API i renderuje tabelę wyników.
         * Odpowiada za wizualizację danych (paski postępu) oraz formatowanie wskaźników SLA.
         */
        async function generateReport() {
            const tbody = document.getElementById('report-tbody');
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Ładowanie danych...</td></tr>';

            // Normalizacja daty końcowej, aby obejmowała cały ostatni dzień zakresu
            const payload = {
                startDate: new Date(document.getElementById('date-start').value).toISOString(),
                endDate: new Date(document.getElementById('date-end').value + 'T23:59:59.999Z').toISOString(), 
                reportType: document.getElementById('type-select').value
            };

            try {
                const response = await fetch('/api/generateReport', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if(!response.ok) throw new Error("Błąd serwera");
                const data = await response.json();

                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Brak danych za wybrany okres.</td></tr>';
                    return;
                }

                // Znalezienie maksymalnej wartości dla skalowania pasków wizualnych
                const maxCount = Math.max(...data.map(d => d.count));

                data.forEach(row => {
                    const tr = document.createElement('tr');
                    const widthPct = (row.count / maxCount) * 100;
                    const slaClass = row.slaBreachPercent > 0 ? 'sla-bad' : 'sla-good';
                    const slaText = row.slaBreachPercent > 0 ? `${row.slaBreachPercent}%` : `0% (OK)`;

                    tr.innerHTML = `
                        <td><strong>${escapeHTML(row.name)}</strong></td>
                        <td>
                            <div class="bar-container"><div class="bar-fill" style="width: ${widthPct}%"></div></div>
                            ${row.count}
                        </td>
                        <td>${row.avgTime} h</td>
                        <td class="${slaClass}">${slaText}</td>
                    `;
                    tbody.appendChild(tr);
                });

                document.getElementById('report-generated-date').textContent = new Date().toLocaleString();

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: red;">Wystąpił błąd podczas generowania raportu.</td></tr>';
            }
        }
        
        /**
         * Zabezpiecza tekst przed atakami XSS przy renderowaniu HTML.
         */
        function escapeHTML(str) {
            if (!str) return '---';
            return str.toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // --- MODUŁ EKSPORTU DANYCH (Client-Side) ---

        function getReportMeta() {
            const start = document.getElementById('date-start').value;
            const end = document.getElementById('date-end').value;
            const typeSelect = document.getElementById('type-select');
            const typeText = typeSelect.options[typeSelect.selectedIndex].text;
            return { start, end, typeText };
        }

        /**
         * Generuje plik PDF z widoku raportu używając biblioteki html2pdf.js.
         * * Hack UI: Funkcja tymczasowo odkrywa ukryte elementy nagłówka i stopki (#report-header-print),
         * generuje zrzut PDF, a następnie ponownie je ukrywa.
         * Dzięki temu PDF wygląda jak oficjalny dokument, a widok na ekranie pozostaje czysty.
         */
        function downloadPDF() {
            const element = document.getElementById('report-results');
            const header = document.getElementById('report-header-print');
            const footer = document.getElementById('report-footer-print');
            
            // 1. Wstrzyknięcie metadanych do nagłówka wydruku
            const meta = getReportMeta();
            header.innerHTML = `
                <h2 style="margin: 0 0 8px 0; font-size: 24px; color: #1f2937;">Raport Service Desk</h2>
                <div style="font-size: 14px; color: #4b5563;">
                    <p style="margin: 4px 0;"><strong>Typ raportu:</strong> ${meta.typeText}</p>
                    <p style="margin: 4px 0;"><strong>Zakres dat:</strong> ${meta.start} — ${meta.end}</p>
                </div>
            `;

            // 2. Tymczasowe pokazanie elementów dla generatora
            header.style.display = 'block';
            footer.style.display = 'block';

            const opt = {
                margin:       0.5,
                filename:     `Raport_${meta.start}_${meta.end}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 }, // Wysoka rozdzielczość
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'landscape' }
            };

            // 3. Generowanie i sprzątanie po zakończeniu (Promise)
            html2pdf().set(opt).from(element).save().then(() => {
                header.style.display = 'none';
                footer.style.display = 'none';
            });
        }

        /**
         * Eksportuje raport do samodzielnego pliku HTML.
         * Tworzy Blob z pełną strukturą strony i stylami inline, co pozwala na
         * otwarcie raportu offline i zachowanie jego wyglądu bez zależności zewnętrznych.
         */
        function downloadHTML() {
            // Pobieramy tylko wyrenderowaną tabelę
            const table = document.querySelector('#report-results table').outerHTML;
            const meta = getReportMeta();
            const now = new Date().toLocaleString();

            const htmlContent = `
                <!DOCTYPE html>
                <html lang="pl">
                <head>
                    <meta charset="UTF-8">
                    <title>Raport Service Desk</title>
                    <style>
                        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; color: #333; }
                        h1 { color: #2563eb; border-bottom: 2px solid #eee; padding-bottom: 10px; }
                        .meta { background: #f9fafb; padding: 15px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e5e7eb; }
                        .meta p { margin: 5px 0; }
                        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
                        th { background-color: #f3f4f6; font-weight: 600; }
                        .sla-bad { color: #dc2626; font-weight: bold; }
                        .sla-good { color: #16a34a; font-weight: bold; }
                        .bar-container { display: none; } /* Paski są zbędne w prostym wydruku */
                    </style>
                </head>
                <body>
                    <h1>Raport Service Desk</h1>
                    <div class="meta">
                        <p><strong>Typ raportu:</strong> ${meta.typeText}</p>
                        <p><strong>Zakres dat:</strong> ${meta.start} do ${meta.end}</p>
                        <p><strong>Wygenerowano:</strong> ${now}</p>
                    </div>
                    ${table}
                </body>
                </html>
            `;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Raport_${meta.start}_${meta.end}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
