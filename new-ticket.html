<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowe Zgłoszenie - Service Desk App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-layout">
        <header class="app-header">
            <div class="header-title">
                Aplikacja do zgłaszania problemów do Service Desk
            </div>
            <div class="header-user-info">
                <span id="userName">Ładowanie...</span>
                <a href="/.auth/logout" class="btn-logout">Wyloguj</a>
            </div>
        </header>

        <div class="app-body">
            <aside class="sidebar">
                <nav class="sidebar-nav">
                    <a href="dashboard.html" class="nav-item">Zgłoszenia</a>
                    <a href="new-ticket.html" class="nav-item active">Nowe zgłoszenie</a>
                    
                    <a href="admin.html" id="admin-link" class="nav-item hidden">Panel Administracyjny</a> 
                    <a href="reports.html" id="reports-link" class="nav-item hidden">Raporty</a>
                </nav>
            </aside>
            
            <main class="main-content">
                <h1>Utwórz nowe zgłoszenie</h1>
                
                <form id="new-ticket-form" class="form-container">
                    
                    <div id="on-behalf-group" class="form-group hidden" style="background-color: #f0f9ff; padding: 15px; border: 1px dashed #3b82f6; border-radius: 8px;">
                        <label for="onBehalfOf">Zgłoszenie w imieniu (E-mail użytkownika)</label>
                        <input type="email" id="onBehalfOf" name="onBehalfOf" class="form-control" placeholder="np. jan.kowalski@techserv.pl (zostaw puste, jeśli zgłaszasz dla siebie)">
                        <small style="color: var(--text-light); display: block; margin-top: 5px;">Wypełnij tylko, jeśli zakładasz zgłoszenie za kogoś innego.</small>
                    </div>

                    <div class="form-group">
                        <label for="title">Tytuł zgłoszenia</label>
                        <input type="text" id="title" name="title" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="content">Treść zgłoszenia</label>
                        <textarea id="content" name="content" class="form-control" rows="10" required></textarea>
                    </div>
                     <div class="form-group">
                        <label for="attachment">Załącznik (opcjonalnie)</label>
                        <div class="file-input-wrapper">
                            <label for="attachment" class="file-input-label">Wybierz plik</label>
                            <input type="file" id="attachment" name="attachment" class="file-input">
                        </div>
                        <div id="file-name" class="upload-feedback"></div>
                    </div>
                    
                    <div class="form-actions">
                         <button type="submit" class="btn btn-primary">Wyślij zgłoszenie</button>
                         <p id="form-status" class="form-status hidden"></p>
                    </div>
                </form>

            </main>
        </div>

        <footer class="app-footer">
            <p>Dominik Nasiłowski 2026 (R)</p>
        </footer>
    </div>
    
    <script>
        async function initializePage() {
            try {
                const response = await fetch('/.auth/me');
                const data = await response.json();
                
                if (!data.clientPrincipal) {
                    window.location.href = 'index.html';
                    return;
                }

                document.getElementById('userName').textContent = data.clientPrincipal.userDetails;

                    const isServiceDesk = data.clientPrincipal.userRoles.includes('sd');

                    if (isServiceDesk) {
                        const adminLink = document.getElementById('admin-link');
                        if (adminLink) adminLink.classList.remove('hidden');

                        const reportsLink = document.getElementById('reports-link');
                        if (reportsLink) reportsLink.classList.remove('hidden');

                        const onBehalfGroup = document.getElementById('on-behalf-group');
                        if (onBehalfGroup) onBehalfGroup.classList.remove('hidden');
                    }

            } catch (error) {
                console.error('Błąd inicjalizacji strony:', error);
                window.location.href = 'index.html';
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const form = event.target;
            const submitButton = form.querySelector('button[type="submit"]');
            const statusMessage = document.getElementById('form-status');

            submitButton.disabled = true;
            statusMessage.textContent = 'Przetwarzanie...';
            statusMessage.classList.remove('hidden', 'success', 'error');

            let attachmentInfo = null;
            const fileInput = form.elements.attachment;

            // Krok 1: Prześlij plik
            if (fileInput.files.length > 0) {
                statusMessage.textContent = 'Przesyłanie załącznika...';
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.readAsDataURL(file);
                await new Promise(resolve => reader.onload = resolve);

                try {
                    const uploadResponse = await fetch('/api/uploadAttachment', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fileName: file.name, fileContent: reader.result })
                    });
                    if (!uploadResponse.ok) throw new Error('Błąd przesyłania pliku');
                    attachmentInfo = await uploadResponse.json(); 
                } catch (error) {
                    statusMessage.textContent = `Błąd: ${error.message}`;
                    statusMessage.classList.add('error');
                    submitButton.disabled = false;
                    return;
                }
            }

            // Krok 2: Utwórz zgłoszenie
            statusMessage.textContent = 'Wysyłanie zgłoszenia...';
            
            // Pobieramy wartość pola "w imieniu"
            const onBehalfOfValue = form.elements.onBehalfOf ? form.elements.onBehalfOf.value : null;

            const ticketData = {
                title: form.elements.title.value,
                content: form.elements.content.value,
                onBehalfOf: onBehalfOfValue, // Wysyłamy do backendu
                attachment: attachmentInfo
            };

            try {
                const response = await fetch('/api/createTicket', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ticketData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }

                statusMessage.textContent = 'Zgłoszenie utworzone pomyślnie! Przekierowywanie...';
                statusMessage.classList.add('success');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                console.error('Błąd tworzenia zgłoszenia:', error);
                statusMessage.textContent = `Błąd: ${error.message}`;
                statusMessage.classList.add('error');
                submitButton.disabled = false;
            }
        }

        initializePage();
        document.getElementById('new-ticket-form').addEventListener('submit', handleFormSubmit);

        const fileInput = document.getElementById('attachment');
        const fileNameDisplay = document.getElementById('file-name');
        
        fileInput.addEventListener('change', () => {
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const maxSize = 50 * 1024 * 1024; // 50 MB w bajtach

                if (file.size > maxSize) {
                    alert("Plik jest za duży! Maksymalny rozmiar to 50MB.");
                    fileInput.value = ""; // Czyścimy wybór
                    fileNameDisplay.textContent = "";
                    return;
                }

                fileNameDisplay.textContent = `Wybrano plik: ${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
            } else {
                fileNameDisplay.textContent = '';
            }
        });
    </script>
</body>
</html>
